[package]
name = "fs2-benchmarks"
version = "0.0.0"
edition = "2024"
rust-version = "1.88.0"
publish = false

[features]
default = ["subject-fs2"]
subject-fs2 = []
subject-fs4 = []

[dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
fs2 = { path = ".." }
tempfile = "3.27"

[[bench]]
name = "fs2"
harness = false

[[bench]]
name = "fs2_legacy"
harness = false

[[bench]]
name = "fs_compat"
harness = false
