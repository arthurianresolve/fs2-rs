name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 1 1 * *"

jobs:
  support-matrix:
    name: Validate support matrix
    outputs:
      matrices: ${{ steps.matrix.outputs.matrices }}
      rust_version: ${{ steps.matrix.outputs.rust_version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check --requirement scripts/requirements.txt
      - id: matrix
        run: python scripts/validate_support_matrix.py --github-output "$GITHUB_OUTPUT"
      - run: python -m unittest discover --start-directory scripts --pattern "test_*.py"

  check:
    needs: support-matrix
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.support-matrix.outputs.matrices).check }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - run: cargo +${{ matrix.toolchain }} clippy --package fs2 --all-targets --target ${{ matrix.target }} --locked -- -D warnings
      - run: cargo +${{ matrix.toolchain }} test --package fs2 --target ${{ matrix.target }} --locked
      - run: python scripts/validate_coverage.py --verify-test-inventory
      - if: matrix.toolchain == needs.support-matrix.outputs.rust_version
        run: python scripts/validate_compatibility.py
      - run: cargo +${{ matrix.toolchain }} bench --manifest-path benchmarks/Cargo.toml --bench fs2 --no-run --locked --target ${{ matrix.target }}

  windows-native-faults:
    needs: support-matrix
    if: github.event_name == 'push' && github.ref == 'refs/heads/DO-178C'
    name: Windows native-fault evidence / Rust 1.97.1 / LLVM 22.1.6
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.97.1"
      - name: Collect deterministic Windows native-fault evidence
        run: python scripts/collect_windows_native_faults.py --output-dir target/windows-native-faults --expected-commit "$env:GITHUB_SHA"
      - name: Validate native-fault evidence without claiming independent review
        run: python scripts/validate_coverage.py --windows-native-fault-manifest target/windows-native-faults/windows-native-fault-manifest.json --expected-commit "$env:GITHUB_SHA" --require-pass
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-native-faults
          path: target/windows-native-faults
          if-no-files-found: error

  object_analysis:
    needs: support-matrix
    if: github.event_name == 'push' && github.ref == 'refs/heads/DO-178C'
    name: Target object inventory / ${{ matrix.target }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.support-matrix.outputs.matrices).object_analysis }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          components: llvm-tools-preview
          targets: ${{ matrix.target }}
      - name: Collect native target-object inventory
        run: python scripts/collect_object_analysis.py --target ${{ matrix.target }} --output-dir target/object-analysis-${{ matrix.target }} --expected-commit "${{ github.sha }}" --locked
      - name: Validate exact-commit object inventory
        run: python scripts/validate_object_analysis.py --manifest target/object-analysis-${{ matrix.target }}/object-analysis-manifest.json --expected-commit "${{ github.sha }}" --require-pass
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: object-analysis-${{ matrix.target }}
          path: target/object-analysis-${{ matrix.target }}
          if-no-files-found: error
      - name: Collect semantic source-object companion
        run: python scripts/collect_semantic_source_object.py --target ${{ matrix.target }} --output-dir target/semantic-source-object-${{ matrix.target }} --expected-commit "${{ github.sha }}" --locked
      - name: Validate exact-commit semantic source-object companion
        run: python scripts/validate_semantic_source_object.py --manifest target/semantic-source-object-${{ matrix.target }}/semantic-source-object-manifest.json --expected-commit "${{ github.sha }}" --require-pass
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: semantic-source-object-${{ matrix.target }}
          path: target/semantic-source-object-${{ matrix.target }}
          if-no-files-found: error

  cross_check:
    needs: support-matrix
    name: ${{ matrix.target }} / Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.support-matrix.outputs.matrices).cross_check }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target }}
      - run: cargo +${{ matrix.toolchain }} check --package fs2 --tests --target ${{ matrix.target }} --locked

  mingw:
    needs: support-matrix
    name: ${{ matrix.target }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.support-matrix.outputs.matrices).mingw }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install MinGW import-library tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mingw-w64
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target }}
      - run: cargo +${{ matrix.toolchain }} build --package fs2 --lib --target ${{ matrix.target }} --locked

  uclibc:
    needs: support-matrix
    name: ${{ matrix.target }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.support-matrix.outputs.matrices).uclibc }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rust-src
      - run: cargo +${{ matrix.toolchain }} check -Z build-std=std,panic_abort --package fs2 --target ${{ matrix.target }} --lib --locked

  coverage:
    needs: support-matrix
    name: Coverage / ${{ matrix.target }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.support-matrix.outputs.matrices).coverage }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          components: llvm-tools-preview
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none
      - name: Collect stable line and region coverage
        run: python scripts/collect_coverage.py --profile stable --target ${{ matrix.target }} --output-dir target/coverage-${{ matrix.target }} --locked
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-${{ matrix.target }}
          path: target/coverage-${{ matrix.target }}
          if-no-files-found: error

  coverage_branch:
    needs: support-matrix
    name: Branch diagnostics / ${{ matrix.target }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.support-matrix.outputs.matrices).coverage_branch }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          components: llvm-tools-preview
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none
      - name: Collect diagnostic branch coverage
        run: python scripts/collect_coverage.py --profile branch --target ${{ matrix.target }} --output-dir target/coverage-branch-${{ matrix.target }} --locked
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-branch-${{ matrix.target }}
          path: target/coverage-branch-${{ matrix.target }}
          if-no-files-found: error

  coverage-gate:
    needs: [support-matrix, coverage, coverage_branch, coverage_condition]
    name: Validate coverage staging bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: target/coverage-artifacts
      - name: Validate provenance and coverage records
        run: python scripts/validate_coverage.py --runs-dir target/coverage-artifacts --require-pass
      - name: Validate raw metric profiles and internal MC/DC closure
        run: python scripts/validate_coverage_metrics.py --runs-dir target/coverage-artifacts --require-pass --require-matrix

  assurance-package:
    needs: [support-matrix, coverage-gate, windows-native-faults, object_analysis]
    if: github.event_name == 'push' && github.ref == 'refs/heads/DO-178C'
    name: Package and retrieve internal assurance staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: target/assurance-inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-native-faults
          path: target/assurance-inputs/windows-native-faults
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: object-analysis-*
          path: target/assurance-inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: semantic-source-object-*
          path: target/assurance-inputs
      - name: Create immutable internal staging package
        run: python scripts/assurance_archive.py create --input-root target/assurance-inputs --output-dir target/assurance-package --control-record coverage/archive-control.json --expected-commit "$GITHUB_SHA" --workflow-run-id "$GITHUB_RUN_ID"
      - name: Verify retrieval contract before publication
        run: python scripts/assurance_archive.py verify --package-dir target/assurance-package --expected-commit "$GITHUB_SHA" --control-record coverage/archive-control.json --result target/assurance-retrieval-result.json
      - name: Independently verify package bytes with the host digest utility
        run: python scripts/independent_archive_verify.py --package-dir target/assurance-package --expected-commit "$GITHUB_SHA" --result target/independent-assurance-retrieval-result.json
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: assurance-evidence-package
          path: target/assurance-package
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: assurance-retrieval-result
          path: |
            target/assurance-retrieval-result.json
            target/independent-assurance-retrieval-result.json
          if-no-files-found: error
          retention-days: 90

  coverage_condition:
    needs: support-matrix
    name: Condition diagnostics / ${{ matrix.target }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.support-matrix.outputs.matrices).coverage_condition }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          components: llvm-tools-preview
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none
      - name: Collect diagnostic condition instrumentation
        run: python scripts/collect_coverage.py --profile condition --target ${{ matrix.target }} --output-dir target/coverage-condition-${{ matrix.target }} --locked
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-condition-${{ matrix.target }}
          path: target/coverage-condition-${{ matrix.target }}
          if-no-files-found: error
