name: CI

on:
  push:
  pull_request:

jobs:
  support-matrix:
    name: Validate support matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          python -c "import json; data=json.load(open('support-matrix.json'));
          assert data['version'] == 1;
          assert set(data['evidence_levels']) == {'runtime', 'compile', 'not-covered'};
          assert all({'target', 'platform', 'evidence', 'allocation', 'ci_job'} <= set(entry) for entry in data['targets']);
          assert all(entry['evidence'] in data['evidence_levels'] for entry in data['targets'])"

  check:
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: ["1.97.1", stable]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib
      - run: cargo bench --no-run

  cross-check:
    name: ${{ matrix.target }} / Rust 1.97.1
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-unknown-linux-gnu
          - x86_64-unknown-illumos
          - x86_64-unknown-redox

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}
      - run: cargo check --target ${{ matrix.target }} --locked

  uclibc:
    name: armv7 uClibc compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: rust-src
      - run: cargo check -Z build-std=std,panic_abort --target armv7-unknown-linux-uclibceabihf --lib --locked
