name: CI

on:
  push:
  pull_request:

jobs:
  support-matrix:
    name: Validate support matrix
    outputs:
      matrices: ${{ steps.matrix.outputs.matrices }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check --requirement scripts/requirements.txt
      - id: matrix
        run: python scripts/validate_support_matrix.py --github-output "$GITHUB_OUTPUT"
      - run: python -m unittest discover --start-directory scripts --pattern "test_*.py"

  check:
    needs: support-matrix
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.support-matrix.outputs.matrices).check }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --package fs2 --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --package fs2 --lib --target ${{ matrix.target }}
      - run: cargo bench --manifest-path benchmarks/Cargo.toml --bench fs2 --no-run --locked --target ${{ matrix.target }}

  cross_check:
    needs: support-matrix
    name: ${{ matrix.target }} / Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.support-matrix.outputs.matrices).cross_check }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target }}
      - run: cargo check --package fs2 --tests --target ${{ matrix.target }} --locked

  uclibc:
    needs: support-matrix
    name: ${{ matrix.target }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.support-matrix.outputs.matrices).uclibc }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rust-src
          targets: ${{ matrix.target }}
      - run: cargo check -Z build-std=std,panic_abort --package fs2 --target ${{ matrix.target }} --lib --locked
