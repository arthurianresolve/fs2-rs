name: Release gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  toolchains:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.88.0", "1.97.1"]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Compile benchmarks
        run: cargo bench --workspace --no-run --locked
      - name: Validate support metadata
        run: cargo xtask matrix
      - name: Validate measurement policy
        run: cargo xtask policy
      - name: Compile compatibility fixtures
        run: cargo xtask compatibility
      - name: Check future incompatibilities
        if: matrix.rust == '1.97.1'
        run: cargo check --workspace --all-targets --locked --future-incompat-report

  package:
    name: Published package
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install MSRV
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: List package contents
        run: cargo package --locked --list | tee package-files.txt
      - name: Reject repository-only files
        run: |
          if grep -E '^(benchmarks|compatibility|tools|\.cargo|\.github)/|^(deny\.toml|support-matrix\.json|CONTEXT\.md|BENCHMARK_VALIDATION_v0\.7\.md)$' package-files.txt; then
            echo "repository-only files entered the fs2 package" >&2
            exit 1
          fi
      - name: Build package
        run: cargo package --locked

  dependencies:
    name: Dependency policy and vulnerabilities
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.97.1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install dependency tools
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-audit --version 0.22.2 --locked
      - name: Check dependency policy
        run: cargo deny check
      - name: Audit vulnerabilities
        run: cargo audit
